name: Relato de Bug
description: Reporte um erro técnico reproduzível na extensão (Chromium ou Firefox)
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Para dúvidas rápidas de uso ou sugestões simples, prefira o [GitHub Discussions](https://github.com/luizGDpulz/octa-blaster/discussions).
  - type: input
    id: version
    attributes:
      label: Versão do OctaBlaster e Navegador
      description: Ex. v0.7.0 — Firefox 132 / Chrome 131
      placeholder: "v0.7.0 — Firefox"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passo a passo para reproduzir
      placeholder: |
        1. Abra um ticket no Octadesk...
        2. Clique em...
        3. Observe o erro...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs do console ou observações adicionais
      description: Remova quaisquer dados sensíveis de clientes, CNPJs ou tokens antes de colar.
