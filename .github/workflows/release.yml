name: Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript types
        run: pnpm compile

      - name: Run regression tests
        run: pnpm test

      - name: Build & Zip for Chrome MV3
        run: pnpm zip

      - name: Build & Zip for Firefox MV2
        run: pnpm zip:firefox

      - name: Sign extension for Firefox (AMO Unlisted)
        if: env.FIREFOX_JWT_ISSUER != '' && env.FIREFOX_JWT_SECRET != ''
        run: |
          pnpm web-ext sign \
            --source-dir .output/firefox-mv2 \
            --artifacts-dir .output \
            --channel unlisted \
            --api-key "${{ secrets.FIREFOX_JWT_ISSUER }}" \
            --api-secret "${{ secrets.FIREFOX_JWT_SECRET }}" \
            --timeout 900000
          VERSION=$(node -p "require('./package.json').version")
          for f in .output/*.xpi; do
            if [ -f "$f" ]; then
              mv "$f" ".output/octa-blaster-${VERSION}.xpi"
              break
            fi
          done
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Generate clean release notes
        run: |
          RAW_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name=${{ github.ref_name }} --jq '.body')
          export RAW_NOTES
          export TAG_NAME="${{ github.ref_name }}"
          node - <<'EOF'
          const fs = require('node:fs');
          const tag = process.env.TAG_NAME || '';
          const version = tag.replace(/^v/, '');
          const rawNotes = (process.env.RAW_NOTES || '')
            .replace(/## New Contributors[\s\S]*?(?=\*\*Full Changelog\*\*)/, '')
            .trim();

          let changelogSection = '';
          if (fs.existsSync('CHANGELOG.md')) {
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const match = changelog.match(new RegExp(`^## \\[${escaped}\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|^\\[[^\\]]+\\]:|(?![\\s\\S]))`, 'm'));
            if (match && match[1]) {
              changelogSection = `## 📋 O que mudou na ${tag}\n\n${match[1].replace(/\n---\s*$/, '').trim()}`;
            }
          }

          const updateGuide = `## 🔄 Como Instalar ou Atualizar

          ### 🦊 Mozilla Firefox (1 clique — Recomendado)
          1. Nos **Assets** abaixo, clique diretamente no arquivo **\`octa-blaster-${version}.xpi\`**.
          2. Confirme em **Adicionar** na janela nativa do Firefox.
          3. Se você já usava uma versão anterior assinada, o Firefox **atualiza automaticamente** preservando seus modelos, tags, variáveis e configurações.

          ### 🌐 Google Chrome / Edge / Brave (Chromium)
          1. Baixe o arquivo **\`octa-blaster-${version}-chrome.zip\`** nos **Assets** abaixo.
          2. **Primeira instalação:** extraia o \`.zip\` em uma pasta permanente, abra \`chrome://extensions\` (ou \`edge://extensions\`), ative o **Modo do desenvolvedor** e clique em **Carregar sem compactação** apontando para a pasta extraída.
          3. **Para atualizar:** extraia o novo \`.zip\` **substituindo os arquivos na mesma pasta** usada anteriormente e clique no ícone **🔄 Recarregar** no card do OctaBlaster em \`chrome://extensions\` (suas configurações salvas são mantidas).`.replace(/^          /gm, '');

          const parts = [changelogSection, rawNotes, updateGuide].filter(Boolean);
          fs.writeFileSync('notes.md', parts.join('\n\n---\n\n') + '\n', 'utf8');
          EOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/*.zip
            .output/*.xpi
          body_path: notes.md
