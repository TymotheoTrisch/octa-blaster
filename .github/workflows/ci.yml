name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript types
        run: pnpm compile

      - name: Install local helper dependencies
        run: pnpm --dir apps/local-helper install --frozen-lockfile --ignore-scripts

      - name: Test local helper
        run: pnpm --dir apps/local-helper test

      - name: Test team gateway
        run: pnpm test:gateway

      - name: Run regression tests
        run: pnpm test

      - name: Build Chrome MV3
        run: pnpm build

      - name: Build Firefox MV2
        run: pnpm build:firefox
