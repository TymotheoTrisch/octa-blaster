services:
  gateway:
    build:
      context: ../..
      dockerfile: apps/team-gateway/Dockerfile
    env_file: ${OCTA_ENV_FILE:-.env}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - gateway-data:/data
      - ./users.json:/run/config/users.json:ro
    networks: [private]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      OCTA_DOMAIN: ${OCTA_DOMAIN:?Defina o domínio HTTPS}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [private]
networks:
  private:
volumes:
  gateway-data:
  caddy-data:
  caddy-config:
